name: Check challenge
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Экшены закреплены по SHA коммита: тег можно перевесить, коммит — нет.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Токен GITHUB_TOKEN не остаётся в .git/config для следующих шагов.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          # Без cache: npm — setup-node вызывает npm config get cache встроенным npm
          # ещё до обновления, и devEngines (npm ≥ 11.19.1) обрывает его.
      # Настройки из .npmrc (min-release-age, strict-allow-scripts) требуют npm 11.19.1.
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm run check
      - name: Verify the running API
        shell: bash
        run: |
          npm start > /tmp/canvas-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4001/health > /dev/null; then break; fi
            sleep 1
          done
          npm run smoke
